    <script>
      (function () {
        try {
          var path = location.pathname || "/";
          var fr = path === "/fr" || path.indexOf("/fr/") === 0;
          var stored = "";
          try { stored = localStorage.getItem("i18nextLng") || ""; } catch (e) {}
          var useFr = fr || stored.indexOf("fr") === 0;
          if (useFr) {
            document.documentElement.lang = "fr";
            document.title = "MySWYM : Plan d'entraînement natation personnalisé";
          } else {
            document.documentElement.lang = "en";
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #f7fafc;
      }
      .myswym-boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(ellipse 80% 55% at 50% 28%, rgba(255, 255, 255, 0.55), transparent 62%),
          linear-gradient(180deg, #9ec8f5 0%, #d4e8fb 38%, #eef5fb 68%, #f7fafc 100%);
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #0f1b2d;
      }
      .myswym-boot-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(280px, 86vw);
      }
      .myswym-boot-stage {
        position: relative;
        width: 168px;
        height: 112px;
        display: grid;
        place-items: center;
      }
      .myswym-boot-blob {
        position: absolute;
        width: 72px;
        height: 56px;
        border-radius: 58% 42% 48% 52% / 46% 54% 46% 54%;
        background: linear-gradient(145deg, #7eb8f5 0%, #3d8fff 48%, #006bfd 100%);
        opacity: 0;
        animation: myswym-boot-blob 1.15s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .myswym-boot-mark {
        position: relative;
        z-index: 1;
        display: block;
        width: 120px;
        height: auto;
        object-fit: contain;
        opacity: 0;
        transform: scale(0.72);
        filter: blur(6px);
        animation: myswym-boot-mark-in 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both;
      }
      .myswym-boot-wordmark {
        display: block;
        height: 22px;
        width: auto;
        max-width: 168px;
        margin-top: 28px;
        object-fit: contain;
        opacity: 0;
        transform: translateY(6px);
        animation: myswym-boot-word-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) 1.05s both;
      }
      @keyframes myswym-boot-blob {
        0% {
          opacity: 0;
          transform: scale(0.55) rotate(-6deg);
          border-radius: 58% 42% 48% 52% / 46% 54% 46% 54%;
          filter: blur(0);
        }
        22% {
          opacity: 1;
          transform: scale(1) rotate(-2deg);
        }
        48% {
          transform: scale(1.14) rotate(3deg);
          border-radius: 42% 58% 52% 48% / 54% 42% 58% 46%;
        }
        72% {
          opacity: 1;
          transform: scale(1.28) rotate(0deg);
          border-radius: 50% 50% 46% 54% / 48% 52% 48% 52%;
          filter: blur(2px);
        }
        100% {
          opacity: 0;
          transform: scale(1.55) rotate(0deg);
          filter: blur(12px);
        }
      }
      @keyframes myswym-boot-mark-in {
        0% { opacity: 0; transform: scale(0.72); filter: blur(6px); }
        55% { opacity: 1; filter: blur(0); }
        78% { transform: scale(1.04); }
        100% { opacity: 1; transform: scale(1); filter: blur(0); }
      }
      @keyframes myswym-boot-word-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .myswym-boot-blob { display: none; }
        .myswym-boot-mark,
        .myswym-boot-wordmark {
          animation: none !important;
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="myswym-boot" role="status" aria-live="polite" aria-busy="true">
        <div class="myswym-boot-inner">
          <div class="myswym-boot-stage" aria-hidden="true">
            <span class="myswym-boot-blob"></span>
            <img class="myswym-boot-mark" src="/logo-mark.png" alt="" width="120" height="114" />
          </div>
          <img class="myswym-boot-wordmark" src="/logo-myswym-on-light.png" alt="MySWYM" height="22" width="95" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
